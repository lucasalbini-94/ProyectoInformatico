<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear cuenta · Portfolio</title>
</head>
<body>
  <main>
    <h1>Crear cuenta</h1>
    <p>Creá tu cuenta y organizá tus proyectos, lenguajes y tecnologías en un solo lugar.</p>

    <form id="form-registro" novalidate>

      <div>
        <label for="nombre">Nombre</label><br>
        <input id="nombre" name="nombre" type="text" maxlength="100" autocomplete="given-name" required>
        <br><span data-error-for="nombre"></span>
      </div>

      <div>
        <label for="apellido">Apellido</label><br>
        <input id="apellido" name="apellido" type="text" maxlength="100" autocomplete="family-name" required>
        <br><span data-error-for="apellido"></span>
      </div>

      <div>
        <label for="nombreUsuario">Nombre de usuario</label><br>
        <input id="nombreUsuario" name="nombreUsuario" type="text" maxlength="50" autocomplete="username" required>
        <br><small>Entre 3 y 50 caracteres.</small>
        <br><span data-error-for="nombreUsuario"></span>
      </div>

      <div>
        <label for="email">Email</label><br>
        <input id="email" name="email" type="email" maxlength="255" autocomplete="email" required>
        <br><span data-error-for="email"></span>
      </div>

      <div>
        <label for="password">Contraseña</label><br>
        <input id="password" name="password" type="password" autocomplete="new-password" required>
        <button type="button" data-ver="password" aria-label="Mostrar contraseña">Mostrar</button>
        <br><small>Mínimo 4 caracteres.</small>
        <br><span data-error-for="password"></span>
      </div>

      <div>
        <label for="password2">Repetir contraseña</label><br>
        <input id="password2" name="password2" type="password" autocomplete="new-password" required>
        <button type="button" data-ver="password2" aria-label="Mostrar contraseña">Mostrar</button>
        <br><span data-error-for="password2"></span>
      </div>

      <p><button type="submit">Crear cuenta</button></p>
      <p id="mensaje" role="status" aria-live="polite"></p>
    </form>

    <p>¿Ya tenés cuenta? <a href="login.html">Iniciá sesión</a></p>
  </main>

  <script type="module" src="js/registro.js"></script>
</body>
</html>
